name: Publier le RSS TV Shows 1080p Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: series-rss-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install beautifulsoup4==4.13.4

      - name: Construire le flux filtré avec images
        shell: python
        run: |
          import html
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import format_datetime
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          from bs4 import BeautifulSoup

          SOURCE = "https://rlsbb.to/category/tv-shows/feed/"
          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          SITE = f"https://{owner.lower()}.github.io/{repo}/"
          FEED = SITE + "feed.xml"

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "SeriesRSS/1.0"}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  print("Statut HTTP :", response.status)
                  return response.read()

          def clean_url(value):
              value = html.unescape(value.strip())
              markdown = re.fullmatch(
                  r"\[([^\]]+)\]\((https?://[^)]+)\)",
                  value
              )
              if markdown:
                  value = markdown.group(2)

              parsed = urlparse(value)
              if parsed.scheme not in ("http", "https") or not parsed.netloc:
                  return None

              return value

          def get_image(soup, base_url):
              for image in soup.find_all("img"):
                  for attribute in ("data-src", "data-lazy-src", "src"):
                      source = image.get(attribute)
                      if not source:
                          continue

                      image_url = clean_url(urljoin(base_url, source))
                      if image_url:
                          return image_url

              return None

          def get_candidate(block):
              if block.find("p"):
                  return None

              heading = block.find("strong")
              if heading is None:
                  return None

              release = heading.get_text(" ", strip=True)
              if not re.search(r"\b1080p\b", release, re.I):
                  return None

              text = block.get_text(" ", strip=True)
              marker = re.search(
                  r"Single\s+File\s+RAR\s*:",
                  text,
                  re.I
              )
              if not marker:
                  return None

              backup = None

              for link in block.find_all("a", href=True):
                  label = link.get_text(" ", strip=True)

                  if not re.fullmatch(
                      r"RAPIDGATOR\s+Backup",
                      label,
                      re.I
                  ):
                      continue

                  previous_text = []

                  for element in block.descendants:
                      if element is link:
                          break
                      if isinstance(element, str):
                          previous_text.append(str(element))

                  if not re.search(
                      r"Single\s+File\s+RAR\s*:",
                      " ".join(previous_text),
                      re.I
                  ):
                      continue

                  backup = clean_url(link["href"])
                  if backup:
                      break

              if not backup:
                  return None

              size = re.search(
                  r"\|\s*(\d+(?:[.,]\d+)?)\s*"
                  r"(TiB|GiB|MiB|KiB|TB|GB|MB|KB)\b",
                  text,
                  re.I
              )
              if not size:
                  return None

              number = float(size.group(1).replace(",", "."))
              unit = size.group(2).upper()

              factors = {
                  "KB": 1000,
                  "MB": 1000**2,
                  "GB": 1000**3,
                  "TB": 1000**4,
                  "KIB": 1024,
                  "MIB": 1024**2,
                  "GIB": 1024**3,
                  "TIB": 1024**4,
              }

              return {
                  "release": release,
                  "size": number * factors[unit],
                  "label": f"{size.group(1)} {size.group(2)}",
                  "url": backup,
              }

          source_root = ET.fromstring(fetch(SOURCE))
          articles = source_root.findall("./channel/item")

          print("Source :", SOURCE)
          print("Nombre d'articles reçus :", len(articles))

          if not articles:
              raise RuntimeError(
                  "Le flux source ne contient aucun article."
              )

          content_tag = (
              "{http://purl.org/rss/1.0/modules/content/}encoded"
          )
          selected = {}

          for article in articles:
              original_title = article.findtext("title", default="")
              content = (
                  article.findtext(content_tag)
                  or article.findtext("description", default="")
              )

              soup = BeautifulSoup(content, "html.parser")
              article_url = (
                  article.findtext("link", default="")
                  or SOURCE
              )
              image_url = get_image(soup, article_url)

              candidates = []

              for block in soup.find_all("p"):
                  candidate = get_candidate(block)
                  if candidate:
                      candidates.append(candidate)

              if not candidates:
                  print("IGNORE :", original_title)
                  continue

              best = max(
                  candidates,
                  key=lambda candidate: candidate["size"]
              )

              identity = re.split(
                  r"\b(?:2160p|1080p|720p|480p|HDTV|WEBRip|"
                  r"WEB-DL|WEB|HLG)\b",
                  original_title,
                  maxsplit=1,
                  flags=re.I
              )[0].strip(" .-_")

              if not identity:
                  identity = original_title

              key = re.sub(
                  r"[\W_]+",
                  "",
                  identity.casefold()
              )

              best["identity"] = identity
              best["image"] = image_url
              best["date"] = article.findtext(
                  "pubDate",
                  default=""
              )

              if (
                  key not in selected
                  or best["size"] > selected[key]["size"]
              ):
                  selected[key] = best

          if not selected:
              raise RuntimeError(
                  "Aucun bloc 1080p avec taille et lien "
                  "Single File RAR: RAPiDGATOR Backup trouvé. "
                  "Publication annulée pour éviter un flux vide."
              )

          rss = ET.Element("rss", {"version": "2.0"})
          channel = ET.SubElement(rss, "channel")

          ET.SubElement(channel, "title").text = (
              "TV Shows — 1080p — Rapidgator Backup"
          )
          ET.SubElement(channel, "link").text = SITE
          ET.SubElement(channel, "description").text = (
              "Depuis le flux général TV Shows : "
              "version 1080p la plus lourde disposant du lien "
              "Single File RAR: RAPiDGATOR Backup."
          )
          ET.SubElement(channel, "language").text = "fr"
          ET.SubElement(channel, "lastBuildDate").text = (
              format_datetime(datetime.now(timezone.utc))
          )

          image_count = 0

          for key, entry in selected.items():
              item = ET.SubElement(channel, "item")

              ET.SubElement(item, "title").text = (
                  f'{entry["identity"]} — 1080p — {entry["label"]}'
              )
              ET.SubElement(item, "link").text = entry["url"]

              ET.SubElement(
                  item,
                  "guid",
                  {"isPermaLink": "false"}
              ).text = f"series-rss:{key}"

              if entry["date"]:
                  ET.SubElement(item, "pubDate").text = (
                      entry["date"]
                  )

              image_html = ""

              if entry.get("image"):
                  image_count += 1
                  image_html = (
                      '<p><img class="webfeedsFeaturedVisual" '
                      f'src="{html.escape(entry["image"], quote=True)}" '
                      f'alt="{html.escape(entry["identity"], quote=True)}"'
                      '></p>'
                  )

              description = (
                  image_html
                  + f'<p>{html.escape(entry["release"])}</p>'
                  + f'<p>Taille : {html.escape(entry["label"])}</p>'
                  + '<p>Single File RAR : '
                  + f'<a href="{html.escape(entry["url"], quote=True)}">'
                  + 'RAPiDGATOR Backup</a></p>'
              )

              ET.SubElement(item, "description").text = description

              print(
                  "GARDE :",
                  entry["identity"],
                  "|",
                  entry["label"],
                  "| Image :",
                  "oui" if entry.get("image") else "non",
                  "|",
                  entry["release"]
              )

          output = Path("public")
          output.mkdir(exist_ok=True)

          ET.indent(rss, space="  ")
          ET.ElementTree(rss).write(
              output / "feed.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          (output / "index.html").write_text(
              '<!doctype html><html lang="fr"><head>'
              '<meta charset="utf-8">'
              '<title>TV Shows — RSS 1080p Backup</title>'
              '<link rel="alternate" type="application/rss+xml" '
              'title="TV Shows 1080p Backup" href="feed.xml">'
              '</head><body>'
              '<h1>TV Shows — RSS 1080p Backup</h1>'
              '<p><a href="feed.xml">Ouvrir le flux RSS</a></p>'
              f'<p>{len(selected)} entrées dans le dernier traitement.</p>'
              f'<p>{image_count} entrées avec image.</p>'
              '</body></html>',
              encoding="utf-8"
          )

          print("Nombre d'entrées publiées :", len(selected))
          print("Nombre d'entrées avec image :", image_count)
          print("Adresse prévue du flux :", FEED)

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers à publier
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publier le flux
        id: deployment
        uses: actions/deploy-pages@v4
